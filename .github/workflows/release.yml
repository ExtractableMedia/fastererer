name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rubygems
    permissions:
      # id-token: write is required for rubygems.org Trusted Publishing OIDC
      id-token: write
      # contents: write lets `bundle exec rake release` (invoked by rubygems/release-gem) push the
      # version tag to origin. The action itself does NOT create a GitHub Release — that's a
      # separate step.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: rubygems/release-gem@v1
